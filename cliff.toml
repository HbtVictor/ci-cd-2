# Configuration git-cliff pour générer le CHANGELOG depuis les Conventional Commits.
# Doc : https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

Toutes les évolutions notables de ce projet sont documentées dans ce fichier.
Le format suit [Keep a Changelog](https://keepachangelog.com/) et la versioning
respecte [Semantic Versioning](https://semver.org/).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "✨ Nouvelles fonctionnalités" },
  { message = "^fix", group = "🐛 Corrections" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^docs", group = "📚 Documentation" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore", group = "🔧 Maintenance" },
  { message = "^ci", group = "👷 CI/CD" },
  { message = "^build", group = "📦 Build" },
  { message = "^style", group = "🎨 Style" },
  { body = ".*security", group = "🔒 Sécurité" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
